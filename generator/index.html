<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Авангард — генератор</title>
<style>
  :root { --bg:#111; --fg:#eee; --muted:#888; --accent:#e63b2e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:Georgia, serif;
         display:flex; flex-direction:column; align-items:center; padding:24px 16px; }
  h1 { font-weight:normal; letter-spacing:.2em; text-transform:uppercase; font-size:20px; margin:0 0 16px; }
  canvas { width:min(90vw, 640px); height:auto; aspect-ratio:1; box-shadow:0 10px 40px #000; }
  .info { margin:16px 0; text-align:center; max-width:640px; }
  .title { font-size:24px; font-style:italic; }
  .traits { color:var(--muted); font-family:monospace; font-size:13px; margin-top:6px; }
  .buttons { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  button { background:none; color:var(--fg); border:1px solid var(--fg); padding:10px 18px;
           font-family:inherit; font-size:15px; cursor:pointer; }
  button:hover { background:var(--fg); color:var(--bg); }
  button.main { border-color:var(--accent); color:var(--accent); }
  button.main:hover { background:var(--accent); color:var(--bg); }
</style>
</head>
<body>
<h1>Авангард · генератор</h1>
<canvas id="c" width="1000" height="1000"></canvas>
<div class="info">
  <div class="title" id="title"></div>
  <div class="traits" id="traits"></div>
</div>
<div class="buttons">
  <button class="main" id="next">Новая картина</button>
  <button id="save">Скачать PNG</button>
  <button id="meta">Скачать метаданные</button>
</div>

<script>
// ---------- случайность по зерну: одно и то же зерно = одна и та же картина ----------
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let R;
const rnd = (a = 1, b) => b === undefined ? R() * a : a + R() * (b - a);
const pick = arr => arr[Math.floor(R() * arr.length)];

// ---------- палитры ----------
const PALETTES = {
  "Супрематизм":   { bg: "#efe8d8", colors: ["#111111", "#d22b1f", "#1f3fa8", "#f2c230", "#2b2b2b"] },
  "Конструктивизм":{ bg: "#e9dfc7", colors: ["#c8102e", "#111111", "#7a6a53", "#f4f1ea"] },
  "Ночной неон":   { bg: "#0b0b14", colors: ["#ff2e88", "#00e5ff", "#f9f871", "#8a2be2", "#ffffff"] },
  "Охра и пепел":  { bg: "#2a2622", colors: ["#c9822b", "#e8d5b0", "#8c3b2a", "#5c5348", "#f0ebe0"] },
  "Холодный разлом":{ bg: "#dfe6ea", colors: ["#0d1b2a", "#415a77", "#e0475b", "#778da9", "#1b263b"] },
};

const STYLES = ["Супрематическая композиция", "Ритм кругов", "Поток", "Разлом"];

const W = 1000, H = 1000;
const ctx = document.getElementById("c").getContext("2d");

// ---------- стили ----------
function suprematism(p) {
  const n = Math.floor(rnd(6, 16));
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(rnd(-0.6, 0.6)); ctx.translate(-W / 2, -H / 2);
  for (let i = 0; i < n; i++) {
    ctx.save();
    ctx.translate(rnd(100, 900), rnd(100, 900));
    ctx.rotate(rnd(-0.3, 0.3));
    ctx.fillStyle = pick(p.colors);
    const w = R() < 0.3 ? rnd(300, 600) : rnd(30, 260);
    const h = R() < 0.5 ? rnd(8, 40) : rnd(30, 220);
    ctx.fillRect(-w / 2, -h / 2, w, h);
    ctx.restore();
  }
  if (R() < 0.6) { // круг
    ctx.fillStyle = pick(p.colors);
    ctx.beginPath(); ctx.arc(rnd(200, 800), rnd(200, 800), rnd(40, 160), 0, Math.PI * 2); ctx.fill();
  }
  if (R() < 0.4) { // крест
    ctx.fillStyle = pick(p.colors);
    const x = rnd(200, 800), y = rnd(200, 800), s = rnd(80, 200), t = s / 4;
    ctx.fillRect(x - s / 2, y - t / 2, s, t); ctx.fillRect(x - t / 2, y - s / 2, t, s);
  }
  ctx.restore();
}

function circles(p) {
  const n = Math.floor(rnd(4, 9));
  for (let i = 0; i < n; i++) {
    const x = rnd(100, 900), y = rnd(100, 900), r = rnd(40, 240), rings = Math.floor(rnd(1, 6));
    for (let k = rings; k > 0; k--) {
      ctx.fillStyle = pick(p.colors);
      ctx.beginPath(); ctx.arc(x, y, r * k / rings, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.lineCap = "round";
  for (let i = 0; i < 25; i++) { // линии-струны
    ctx.strokeStyle = pick(p.colors); ctx.lineWidth = rnd(1, 8);
    ctx.beginPath(); ctx.moveTo(rnd(W), rnd(H)); ctx.lineTo(rnd(W), rnd(H)); ctx.stroke();
  }
  for (let i = 0; i < 6; i++) { // дуги
    ctx.strokeStyle = pick(p.colors); ctx.lineWidth = rnd(4, 20);
    ctx.beginPath(); const a = rnd(Math.PI * 2);
    ctx.arc(rnd(W), rnd(H), rnd(60, 300), a, a + rnd(0.5, 2.5)); ctx.stroke();
  }
  if (R() < 0.5) { // шахматный блок
    const x = rnd(100, 700), y = rnd(100, 700), s = rnd(15, 35), c1 = pick(p.colors);
    for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++)
      if ((i + j) % 2) { ctx.fillStyle = c1; ctx.fillRect(x + i * s, y + j * s, s, s); }
  }
}

function flow(p) {
  const f1 = rnd(0.002, 0.008), f2 = rnd(0.002, 0.008), sh = rnd(10);
  const angle = (x, y) => Math.sin(x * f1 + sh) * 2 + Math.cos(y * f2 - sh) * 2 + Math.sin((x + y) * 0.003);
  ctx.lineCap = "round";
  for (let i = 0; i < 1400; i++) {
    let x = rnd(W), y = rnd(H);
    ctx.strokeStyle = pick(p.colors); ctx.lineWidth = rnd(0.5, 4); ctx.globalAlpha = rnd(0.4, 1);
    ctx.beginPath(); ctx.moveTo(x, y);
    const steps = Math.floor(rnd(20, 90));
    for (let s = 0; s < steps; s++) {
      const a = angle(x, y); x += Math.cos(a) * 4; y += Math.sin(a) * 4; ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function glitch(p) {
  for (let i = 0; i < 9; i++) {
    ctx.fillStyle = pick(p.colors);
    ctx.fillRect(rnd(-100, 800), rnd(-100, 800), rnd(150, 500), rnd(150, 500));
  }
  // сдвиги полос как «разлом»
  const bands = Math.floor(rnd(15, 40));
  for (let i = 0; i < bands; i++) {
    const y = Math.floor(rnd(H)), h = Math.floor(rnd(4, 60)), dx = Math.floor(rnd(-150, 150));
    const strip = ctx.getImageData(0, y, W, h);
    ctx.putImageData(strip, dx, y);
  }
  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = pick(p.colors);
    ctx.fillRect(rnd(W), rnd(H), rnd(2, 120), rnd(1, 6));
  }
}

function grain() { // зерно, как на старой бумаге
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = (R() - 0.5) * 28;
    d[i] += g; d[i + 1] += g; d[i + 2] += g;
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- названия ----------
const WORDS_A = ["Разлом", "Тишина", "Крик", "Ритм", "Падение", "Сигнал", "Эхо", "Пульс", "Предел", "Шёпот"];
const WORDS_B = ["пространства", "металла", "времени", "красного", "пустоты", "города", "света", "памяти", "машины", "горизонта"];

// ---------- главная функция ----------
let current = null;
function draw(seed) {
  R = mulberry32(seed);
  const paletteName = pick(Object.keys(PALETTES));
  const p = PALETTES[paletteName];
  const style = pick(STYLES);

  ctx.globalAlpha = 1;
  ctx.fillStyle = p.bg; ctx.fillRect(0, 0, W, H);
  if (style === STYLES[0]) suprematism(p);
  if (style === STYLES[1]) circles(p);
  if (style === STYLES[2]) flow(p);
  if (style === STYLES[3]) glitch(p);
  grain();

  const title = `${pick(WORDS_A)} ${pick(WORDS_B)}`;
  current = { seed, title, style, palette: paletteName };
  document.getElementById("title").textContent = `«${title}»`;
  document.getElementById("traits").textContent = `стиль: ${style} · палитра: ${paletteName} · зерно: ${seed}`;
  location.hash = seed;
}

function newSeed() { return Math.floor(Math.random() * 1e9); }

function download(name, url) {
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
}

document.getElementById("next").onclick = () => draw(newSeed());
document.getElementById("save").onclick = () =>
  download(`avangard-${current.seed}.png`, document.getElementById("c").toDataURL("image/png"));
// метаданные в формате NFT (стандарт OpenSea) — понадобятся в части 2
document.getElementById("meta").onclick = () => {
  const meta = {
    name: current.title,
    description: "Авангардное генеративное произведение. Создано алгоритмом.",
    image: `avangard-${current.seed}.png`,
    attributes: [
      { trait_type: "Стиль", value: current.style },
      { trait_type: "Палитра", value: current.palette },
      { trait_type: "Зерно", value: String(current.seed) },
    ],
  };
  const blob = new Blob([JSON.stringify(meta, null, 2)], { type: "application/json" });
  download(`avangard-${current.seed}.json`, URL.createObjectURL(blob));
};

const fromHash = parseInt(location.hash.slice(1), 10);
draw(Number.isFinite(fromHash) ? fromHash : newSeed());
</script>
</body>
</html>
