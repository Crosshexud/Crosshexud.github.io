<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<title>КИР — галерея</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/site/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/site/css/kir.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
  @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; } }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer;
          text-align: left; padding: 0; color: var(--fg); font: inherit; transition: transform .15s, border-color .15s; }
  .tile:hover { transform: translateY(-3px); border-color: #4a423a; }
  .tile .pic { aspect-ratio: 3/4; background: #050505; }
  .tile .pic img { width: 100%; height: 100%; object-fit: cover; }
  .tile .cap { padding: 10px 12px 12px; }
  .tile .cap b { font-family: var(--serif); font-size: 18px; font-weight: 600; display: block; line-height: 1.2;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .cap span { font-size: 12px; color: var(--muted); }
  .bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; }
  .detail img { border-radius: 12px; width: 100%; aspect-ratio: 3/4; object-fit: contain; background: #050505; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; margin: 14px 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  .tile { transition: transform .35s var(--ease), border-color .3s, box-shadow .35s; }
  .tile:hover { transform: translateY(-5px); border-color: var(--line-2); box-shadow: 0 24px 40px -20px rgba(0,0,0,.9); }
  .tile .pic { overflow: hidden; }
  .tile .pic img { transition: transform .6s var(--ease); }
  .tile:hover .pic img { transform: scale(1.04); }
  /* пустая галерея: карточка поверх приглушённой стены работ */
  .soon { grid-column: 1 / -1; position: relative; border-radius: 22px; overflow: hidden; min-height: 460px; display: grid; place-items: center; padding: 24px 16px; }
  .soon .wall { position: absolute; inset: -20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px;
                transform: rotate(-4deg) scale(1.1); opacity: .32; filter: saturate(.8);
                mask-image: radial-gradient(ellipse at center, transparent 10%, #000 70%); }
  .soon .wall img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 4px; }
  .soon .card { position: relative; max-width: 460px; text-align: center; padding: 32px 24px; background: rgba(24, 22, 20, .86); backdrop-filter: blur(10px); }
  .soon .eyebrow { justify-content: center; }
  .soon h2 { font-family: var(--display); font-weight: 600; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.02em; }
  .soon p { margin: 10px 0 20px; }
  .tile .pic { position: relative; }
  .tag { position: absolute; left: 8px; top: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
         padding: 4px 9px; border-radius: 999px; background: var(--accent); color: #fff; }
  /* фильтр по коллекциям */
  #filter .chip { cursor: pointer; font: inherit; font-size: 12.5px; }
  #filter .chip.on { background: var(--card-2); color: var(--fg); border-color: var(--line-2); }
  #count { margin-left: auto; } /* счётчик — справа, рядом с «Обновить» */
</style>
</head>
<body data-page="gallery">
<main class="wrap">
  <div class="hero">
    <div class="eyebrow">Все коллекции</div>
    <h1>Галерея</h1>
    <p>NFT коллекций «КИР», «Богомол», «Хом» и «Шумеры» — прямо из блокчейна Solana.</p>
  </div>
  <div class="bar">
    <div class="chips" id="filter" hidden></div>
    <span class="muted small" id="count"></span>
    <button class="btn sm" id="reload">Обновить</button>
  </div>
  <div class="grid" id="grid"></div>
</main>

<script src="/site/js/config.js"></script>
<script src="/site/js/kir-mint.js"></script>
<script src="/site/js/ui.js"></script>
<script>
const $ = id => document.getElementById(id);
const { esc, short, toast } = KIRUI;
let items = [], show = 'all'; // show — ключ коллекции в фильтре или 'all'

function skeleton(n = 8) {
  $('grid').innerHTML = Array.from({ length: n }, () =>
    `<div class="tile"><div class="pic skeleton"></div><div class="cap"><b class="skeleton" style="height:18px;border-radius:4px">&nbsp;</b></div></div>`).join('');
}

function empty() {
  $('count').textContent = '';
  $('grid').innerHTML = `<div class="soon"><div class="wall" id="wall"></div>
    <div class="card">
    <h2>Скоро здесь появятся работы</h2>
    <p class="muted">Первые NFT коллекции уже готовятся. А пока — посмотри, что умеет генератор.</p>
    <a class="btn primary" href="/remix/">Создать первый NFT</a></div></div>`;
  // за карточкой — приглушённая стена из работ генератора (на открытой версии их может не быть — тогда просто без стены)
  fetch('/remix/works/index.json').then(r => r.json()).then(all => {
    const pick = all.sort(() => Math.random() - 0.5).slice(0, 60);
    $('wall').innerHTML = pick.map(w => `<img src="/remix/works/t/${w.s}-${w.seed}.webp" alt="" loading="lazy">`).join('');
  }).catch(() => {});
}

async function load() {
  skeleton();
  $('count').textContent = 'Загружаю из блокчейна…';
  $('filter').hidden = true;
  try {
    // NFT всех коллекций; адреса коллекций браузер помнит, а если нет — находит по кошельку автора
    items = await KIRMint.allAssets();
  } catch (e) {
    $('count').textContent = '';
    $('grid').innerHTML = `<div class="card" style="grid-column:1/-1">Не удалось загрузить: ${esc(e.message || e)}</div>`;
    return;
  }
  if (!items.length) return empty();
  auctionReady = await AU.ready();
  // фильтр — только по коллекциям, где уже есть работы, и только если их больше одной
  const has = Object.keys(KIRMint.COLLECTIONS).filter(k => items.some(n => n.series === k));
  if (!has.includes(show)) show = 'all';
  $('filter').hidden = has.length < 2;
  $('filter').innerHTML = [['all', 'Все', items.length], ...has.map(k => [k, KIRMint.COLLECTIONS[k].name, items.filter(n => n.series === k).length])]
    .map(([k, label, n]) => `<button class="chip ${k === show ? 'on' : ''}" data-f="${k}">${esc(label)} <b>${n}</b></button>`).join('');
  paint();
}

function paint() {
  const list = show === 'all' ? items : items.filter(n => n.series === show);
  $('count').textContent = `Работ: ${list.length}`;
  $('grid').innerHTML = list.map(n => `
    <button class="tile" data-a="${esc(n.address)}">
      <div class="pic">${n.image ? `<img src="${esc(n.image)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('gone')">` : ''}${onAuction(n) ? '<span class="tag">на аукционе</span>' : ''}</div>
      <div class="cap"><b>${esc(n.name)}</b><span>${esc(n.collectionName)} · ${onAuction(n) ? 'идут торги' : n.owner === KIRMint.owner ? 'твоя' : 'владелец ' + short(n.owner)}</span></div>
    </button>`).join('');
}

$('filter').onclick = e => {
  const b = e.target.closest('[data-f]');
  if (!b) return;
  show = b.dataset.f;
  $('filter').querySelectorAll('[data-f]').forEach(x => x.classList.toggle('on', x === b));
  paint();
};

// ---------- аукцион: NFT на торгах принадлежит счёту лота ----------
const AU = KIRMint.auction;
let auctionReady = false;
const onAuction = n => n.owner === AU.addressOf(n.address);

async function sell(n) {
  const v = await KIRUI.sheet(`
    <div><div class="eyebrow">Аукцион</div><h3 style="font-size:28px;margin-bottom:6px">Выставить «${esc(n.name)}»</h3>
    <p class="muted small" style="margin:0 0 16px">NFT перейдёт на хранение программе аукциона. Если ставок не будет — вернётся тебе.</p>
    <label class="field"><span>Стартовая цена, SOL</span><input class="input" id="s-min" type="number" inputmode="decimal" min="0.001" step="0.01" value="0.1"></label>
    <label class="field"><span>Шаг ставки, SOL</span><input class="input" id="s-step" type="number" inputmode="decimal" min="0.001" step="0.01" value="0.05"></label>
    <div class="field"><span>Сколько идут торги</span><div class="seg" id="s-dur">
      <button type="button" data-d="3600">1 час</button><button type="button" data-d="86400" class="on">1 день</button>
      <button type="button" data-d="259200">3 дня</button><button type="button" data-d="604800">7 дней</button></div></div>
    <div class="btns" style="flex-direction:column;margin-top:18px">
      <button class="btn primary" data-v="go">Выставить на аукцион</button>
      <button class="btn ghost" data-v="close">Отмена</button></div></div>`, '', box => {
        box.querySelectorAll('#s-dur [data-d]').forEach(b => b.onclick = () => {
          box.querySelectorAll('#s-dur [data-d]').forEach(x => x.classList.toggle('on', x === b));
        });
      });
  if (v?.v !== 'go') return;
  const min = +v.box.querySelector('#s-min').value, step = +v.box.querySelector('#s-step').value;
  const duration = +v.box.querySelector('#s-dur .on').dataset.d;
  if (!(min >= 0.001) || !(step >= 0.001)) return toast('Цена и шаг — не меньше 0.001 SOL', 'err');
  toast('Подтверди в Phantom…');
  try {
    await AU.create({ asset: n.address, collection: n.collection, minBid: min, step, duration });
    toast('Работа выставлена на аукцион!', 'ok');
    location.href = '/site/auction.html#' + AU.addressOf(n.address);
  } catch (e) { toast('Не получилось: ' + esc(e.message || e), 'err', 9000); }
}

$('grid').onclick = e => {
  const t = e.target.closest('.tile[data-a]');
  if (!t) return;
  const n = items.find(x => x.address === t.dataset.a);
  const mine = n.owner === KIRMint.owner, lot = onAuction(n);
  KIRUI.sheet(`
    <div class="detail">${n.image ? `<img src="${esc(n.image)}" alt="" onerror="this.parentNode.classList.add('gone')">` : ''}</div>
    <div>
      <div class="eyebrow">${esc(n.collectionName)}</div>
      <h2 style="font-size:34px">${esc(n.name)}</h2>
      ${n.description ? `<p class="muted">${esc(n.description)}</p>` : ''}
      <div class="chips">${n.attributes.map(a => `<span class="chip">${esc(a.trait_type)}: <b>${esc(a.value)}</b></span>`).join('')}</div>
      <dl class="kv">
        <dt>Владелец</dt><dd class="mono">${lot ? 'аукцион (идут торги)' : mine ? 'ты' : short(n.owner)}</dd>
        <dt>Адрес NFT</dt><dd class="mono">${short(n.address)}</dd>
      </dl>
      <div class="btns" style="flex-direction:column">
        ${lot ? `<a class="btn primary" href="/site/auction.html#${n.owner}">Перейти к торгам</a>` : ''}
        ${mine && auctionReady ? '<button class="btn primary" data-v="sell">Выставить на аукцион</button>' : ''}
        <a class="btn" href="${KIRMint.explorer(n.address)}" target="_blank">Запись в блокчейне</a>
        ${n.image ? `<a class="btn" href="${esc(n.image)}" target="_blank">Оригинал картинки</a>` : ''}
        <button class="btn ghost" data-v="close">Закрыть</button>
      </div>
    </div>`, 'two').then(v => { if (v === 'sell') sell(n); });
};

$('reload').onclick = load;
KIRUI.ready.then(() => { load(); KIRMint.onChange(o => { if (o) load(); }); });
</script>
</body>
</html>
