[package]
name = "kir_auction"
version = "0.1.0"
edition = "2021"
description = "Аукцион NFT «КИР» (Metaplex Core) на Solana"

[lib]
crate-type = ["cdylib", "lib"]

[features]
# короткие торги для автотестов (не для выкладки!)
test-short = []

[dependencies]
pinocchio = { version = "0.11", features = ["cpi"] }
pinocchio-system = "0.6"

# на компьютере (для cargo test) — PDA считаются без блокчейна
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-address = { version = "2", features = ["curve25519", "syscalls"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
